# This workflow checks Python formatting on pull requests and pushes.
name: Python Pep8 Continuous Integration

on:
  pull_request:
  push:
    branches:
    - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        # Make sure the actual branch is checked out when running on pull requests
        ref: ${{ github.head_ref }}
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install autopep8
      run: python -m pip install --disable-pip-version-check autopep8==2.0.4
    - name: Format Python files
      shell: bash
      run: |
        while IFS= read -r -d '' file; do
          autopep8 --in-place --max-line-length 80 "$file"
        done < <(find saythanks tests -type f -name '*.py' -print0)
        autopep8 --in-place --max-line-length 80 t.py
        git diff --check
